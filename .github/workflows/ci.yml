name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 与 DSH 桌面端自带的 Node 对齐（node:sqlite 无 flag 可用）
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # 这条同时校验：模块能导入、入口文件与 cordis.patch.yml 真的在（漏提交 lib/ 会红）
      - name: 模块与必需文件
        run: node scripts/check.mjs
      - name: 测试
        run: node tests/run.mjs
      - name: 打包内容
        run: node scripts/pack.mjs
